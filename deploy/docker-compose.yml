services:
  pulse:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://pulse:${POSTGRES_PASSWORD:-pulse}@postgres:5432/pulse
      # 改成 Agent 能访问到的地址，安装命令会用它
      PULSE_PUBLIC_URL: ${PULSE_PUBLIC_URL:-http://localhost:8080}
      # 可选：Fine-grained PAT（Contents、Metadata 只读），不设置时用 gh auth login 登录
      GH_TOKEN: ${GH_TOKEN:-}
    volumes:
      # 签名密钥、仓库克隆、分析工作区；删除这个卷会让已注册的 Agent 无法验证新指令
      - pulse-data:/var/lib/pulse
      - pulse-gh:/root/.config/gh
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: timescale/timescaledb:2.22.1-pg16
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse}
      POSTGRES_DB: pulse
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse"]
      interval: 5s
      retries: 20
    restart: unless-stopped

volumes:
  pg-data:
  pulse-data:
  pulse-gh:
